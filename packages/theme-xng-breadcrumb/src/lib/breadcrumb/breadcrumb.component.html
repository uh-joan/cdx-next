<xng-breadcrumb [separator]="separatorIcon" class="cdx-xng-breadcrumb-theme">
  <ng-container *xngBreadcrumbItem="let breadcrumb; let info = info">
    @if (info) {
    <mat-icon inline>{{ info }}</mat-icon>
    } @if (!info) {
    {{ breadcrumb }}
    }
  </ng-container>
</xng-breadcrumb>

<ng-template #separatorIcon>
  <mat-icon inline>chevron_right</mat-icon>
</ng-template>
