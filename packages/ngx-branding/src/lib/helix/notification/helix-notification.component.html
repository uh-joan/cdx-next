<div class="hlx-notification__message">
  <div class="hlx-notification__icon">
    <div #customIconWrapper>
      <ng-content select="[icon]"></ng-content>
    </div>
    @if (!customIconWrapper.children.length) {
      <mat-icon>{{ notificationIcons[theme()] }}</mat-icon>
    }
  </div>

  <div class="hlx-notification__text">
    @if (title()) {
      <div class="hlx-notification__title">{{ title() }}</div>
    }
    <div class="hlx-notification__content">
      <ng-content></ng-content>
    </div>
  </div>

  @if (presentation() === 'inline' && !!dismissable()) {
    <button
      class="hlx-notification__close"
      matIconButton
      aria-label="Dismiss"
      (click)="onDismiss()"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</div>

<div class="hlx-notification__actions">
  @if (action()) {
    <button matButton (click)="onAction()">{{ action() }}</button>
  }
  @if (secondaryAction()) {
    <button matButton (click)="onSecondaryAction()">
      {{ secondaryAction() }}
    </button>
  }
  <ng-content select="[actions]"></ng-content>
  @if (presentation() === 'banner' && !!dismissable()) {
    <button matButton (click)="onDismiss()">Dismiss</button>
  }
</div>
