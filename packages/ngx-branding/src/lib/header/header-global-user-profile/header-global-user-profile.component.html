<ng-container *ngIf="authenticated; else notAuthenticated">
  <button mat-button [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
    {{ tokenPayload ? tokenPayload['1p:fnm'] : 'First Name' }}
  </button>
</ng-container>

<mat-menu #menu="matMenu" class="cdx-header-global-user-profile__menu">
  <div>
    <div class="cdx-header-global-user-profile__user-name">
      {{ tokenPayload ? tokenPayload['1p:fnm'] : 'First' }}
      {{ tokenPayload ? tokenPayload['1p:lnm'] : 'Last' }}
    </div>
    <div class="cdx-header-global-user-profile__user-email">
      {{ tokenPayload ? tokenPayload['1p:eml'] : 'Email' }}
    </div>
  </div>

  <ng-content></ng-content>

  <button color="primary" mat-button (click)="authenticationService.logout()">
    Sign out
  </button>
</mat-menu>

<ng-template #notAuthenticated>
  <button mat-button (click)="authenticationService.login()">
    <mat-icon>login</mat-icon>
    <span>Sign in</span>
  </button>
</ng-template>
