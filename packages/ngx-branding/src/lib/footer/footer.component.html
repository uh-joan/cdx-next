<div class="cdx-footer__copyright">© 2022 Clarivate</div>

<div class="cdx-footer__content">
  <ng-template [ngIf]="groupCompanyLinks" [ngIfElse]="companyLinks">
    <cdx-footer-group>
      <cdx-footer-group-title>Company</cdx-footer-group-title>
      <ng-container *ngTemplateOutlet="companyLinks"></ng-container>
    </cdx-footer-group>
  </ng-template>
  <ng-template #companyLinks>
    <a cdx-footer-link href="https://clarivate.com/legal-center/">
      Legal center
    </a>
    <a cdx-footer-link href="https://clarivate.com/privacy-center/">
      Privacy notice
    </a>
    <a
      cdx-footer-link
      href="https://clarivate.com/privacy-center/notices-policies/cookie-policy/"
    >
      Cookie policy
    </a>
    <a
      (click)="manageCookiePreferences()"
      (keydown.enter)="manageCookiePreferences()"
      *ngIf="isCookieManagementEnabled()"
      cdx-footer-link
      tabindex="0"
    >
      Manage cookie preferences
    </a>
  </ng-template>

  <ng-content></ng-content>
</div>
