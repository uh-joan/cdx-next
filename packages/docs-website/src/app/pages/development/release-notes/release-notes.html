<hlx-page [title]="'Release Notes'" [section]="'Development'">
  <mat-form-field appearance="outline">
    <mat-label>Major Version</mat-label>
    <mat-select
      [value]="selectedVersion()"
      (selectionChange)="onVersionSelected($event.value)"
    >
      @for (version of availableVersions(); track version) {
      <mat-option [value]="version"> {{ version }} </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div [innerHtml]="releaseNotesHtml()"></div>
</hlx-page>
