<hlx-page [title]="'Release Note'" [section]="'Development'">
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Versione</mat-label>
      <mat-select formControlName="version" (selectionChange)="loadVersion()">
        <mat-option *ngFor="let file of releaseNotesFiles" [value]="file">
          {{ file.replace('.mdx', '') }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <div class="release-note-content" [innerHTML]="releaseNotesHtml"></div>
</hlx-page>
