<div class="content">
  <div class="content__top-block">
    <div class="top-block__title">
      <h1 class="top-block__eyebrow mat-headline-small">
        Welcome to the Helix Design System
      </h1>
      <p class="top-block__lead mat-display-large">
        Design, develop and deliver intuitive Life Science &amp; Healthcare
        products
      </p>
    </div>
    <img [src]="'/home/home.svg'" alt="Helix Design System" />
  </div>

  <div class="content__bottom-block">
    @for (cardData of cardConfigs; track cardData.title) {
    <app-card-c [cardData]="cardData"> </app-card-c>
    }
  </div>
</div>

<footer hlx-footer slim branded></footer>
