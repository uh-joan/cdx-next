<hlx-page
  [title]="'Dialog'"
  [subtitle]="
    'Dialogs are purposefully interruptive windows that inform users about a task and can contain critical information, require decisions, or involve multiple tasks.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>dialog</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/dialog/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
