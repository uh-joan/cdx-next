<hlx-page
  [title]="'Divider'"
  [subtitle]="
    'A divider is a horizontal line creating a discrete separation between two components, sections, or pieces of content.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>divider</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/divider/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
