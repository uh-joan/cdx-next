<hlx-page
  [title]="'Icons'"
  [subtitle]="
    'Product icons are the visual expression of a brand and product, typically related to UI actions.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>icons</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/icon/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
