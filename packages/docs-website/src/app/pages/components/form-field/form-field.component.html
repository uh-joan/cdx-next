<hlx-page
  [title]="'Form Field'"
  [subtitle]="
    'Form field is a component used to wrap several Angular Material components and apply common text field styles such as the underline, floating label, and hint messages.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>form-field</strong>, visit
    the Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/form-field/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
