<hlx-page
  [title]="'Progress Spinner'"
  [subtitle]="
    'Progress spinners are used when retrieving data or performing slow computations, and help to notify users that loading is underway.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>progress spinner</strong>,
    visit the Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/progress-spinner/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
