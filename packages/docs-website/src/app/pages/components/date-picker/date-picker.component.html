<hlx-page
  [title]="'Date Picker'"
  [subtitle]="
    'A date picker makes it easy and quick for your users to enter a date through text input or from a calendar pop-up.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>

  <p>
    For more information about the API for <strong>datepicker</strong>, visit
    the Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/datepicker/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
