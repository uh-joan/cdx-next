<hlx-page
  [title]="'Sidenav'"

>

    For more information about the API for <strong>sidenav</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"

  <h2>Examples</h2>

  }
</hlx-page>
