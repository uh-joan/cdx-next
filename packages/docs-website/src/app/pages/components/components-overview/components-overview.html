<hlx-page
  [title]="'Component overview'"
  [section]="'Components'"
  [subtitle]="'Angular Material components, Helix components, and external third party libraries.'"
>
  <table class="component-table">
    <thead>
      <tr>
        <th scope="col">Component</th>
        <th scope="col">Description</th>
        <th scope="col">Figma component</th>
      </tr>
    </thead>
    <tbody>
      @for (component of components; track component.route) {
      <tr>
        <th scope="row">
          <cdx-internal-link
            [inline]="true"
            [text]="component.title"
            [url]="component.route"
          ></cdx-internal-link>
        </th>
        <td>{{ component.text }}</td>
        <td>
          @if (component.figmaUrl; as figmaUrl) {
          <a
            underline
            [href]="figmaUrl"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Open ' + component.title + ' in Figma'"
            >Open in Figma</a
          >
          } @else {
          <span aria-label="Not available">–</span>
          }
        </td>
      </tr>
      }
    </tbody>
  </table>
</hlx-page>
