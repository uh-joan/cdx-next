<hlx-page
  [title]="'Snackbar'"
  [subtitle]="
    'A Snackbar, more commonly referred to as a `toast`, is a type of notification that provides a brief message about the application state (e.g. `connection issue`), or feedback based a users interaction (e.g. `file deleted`).'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>snackbar</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/snack-bar/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
