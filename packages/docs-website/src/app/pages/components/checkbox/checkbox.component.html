<hlx-page
  [title]="'Checkbox'"
  [subtitle]="
    'Checkboxes are used when there are multiple items to select in a list. Users can select zero, one, or any number of items. Checkboxes can turn an item on or off.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>checkbox</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/checkbox/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
