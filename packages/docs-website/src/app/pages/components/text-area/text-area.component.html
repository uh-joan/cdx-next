<hlx-page
  [title]="'Text Area'"
  [subtitle]="
    'Text Area defines a multi-line text input control, which can hold an unlimited number of characters.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>textarea</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/input/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
