<hlx-page
  [title]="'Header'"
  [subtitle]="'The product UI header displays primary navigation within applications.'"
  [section]="'Components'"
>
  <h2>Module Import for HLX Header</h2>

  <cdx-highlight [text]="moduleText"></cdx-highlight>

  <mat-divider></mat-divider>

  <h2>Playground</h2>
  <p>
    Try every configuration with live controls. The density toolbar applies the
    levels from Foundations › Density.
  </p>
  <cdx-storybook-embed componentId="branding-header"></cdx-storybook-embed>

  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>
  }
</hlx-page>
