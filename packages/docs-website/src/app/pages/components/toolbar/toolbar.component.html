<hlx-page
  [title]="'Toolbar'"
  [subtitle]="
    'The Toolbar is a container for titles, navigation, icons, or actions.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>toolbar</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/toolbar/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
