<hlx-page
  [title]="'Buttons'"
  [subtitle]="'Buttons are clickable elements that are used to trigger actions. They communicate calls to action to the user and allow users to interact with pages in a variety of ways.'"
  [section]="'Components'"
  componentName="button"
>
  <h2>Playground</h2>
  <p>
    Try every configuration with live controls. The density toolbar applies the
    levels from Foundations › Density.
  </p>
  <cdx-storybook-embed componentId="components-button"></cdx-storybook-embed>

  <mat-divider></mat-divider>

  <h2>Examples</h2>

  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample" />
  }
</hlx-page>
