<hlx-page
  [title]="'Slide Toggle'"
  [subtitle]="'A Slide Toggle switches the state of an item to on or off.'"
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>slide-toggle</strong>, visit
    the Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/slide-toggle/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
