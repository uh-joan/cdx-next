<hlx-page
  [title]="'Sort Header'"
  [subtitle]="'Sort headers add sorting functionality to data tables, allowing users to sort rows, columns, or entire tables.'"
  [section]="'Components'"
  componentName="sort"
  storybookId="components-sort-header"
  tabbed
>
  <div overview>
    <p>
      By default, sort headers toggle between ascending and descending order.
      For implementation details, see the Code tab.
    </p>
    <p>
      For general table guidance, see
      <cdx-internal-link
        [inline]="true"
        [text]="'Components › Table'"
        [url]="'/components/table'"
      ></cdx-internal-link
      >.
    </p>
  </div>

  <div code>
    <h2>Examples</h2>
    @for (sample of sampleList; track sample.exampleName) {
    <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>
    }
  </div>
</hlx-page>
