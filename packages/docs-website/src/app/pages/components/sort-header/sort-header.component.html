<hlx-page
  [title]="'Sort Header'"
  [subtitle]="
    'Sort headers are used in conjunction with data tables to add sorting functionality to a table row, column, or whole table. The default set up of a sort header sorts by ascending then descending.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>sort header</strong>, visit
    the Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/sort/api'"
  ></cdx-external-link>
  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
