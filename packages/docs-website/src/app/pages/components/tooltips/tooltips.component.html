<hlx-page
  [title]="'Tooltips'"
  [subtitle]="
    'Tooltips are floating labels that briefly explain the function of an unknown or unfamiliar user interface element that isn`t directly described within the interface.'
  "
  [section]="'Components'"
>
  <h2>Angular Material Documentation</h2>
  <p>
    For more information about the API for <strong>tooltip</strong>, visit the
    Angular Material docs:
  </p>
  <cdx-external-link
    [inline]="false"
    [url]="'https://material.angular.io/components/tooltip/api'"
  ></cdx-external-link>

  <mat-divider></mat-divider>

  <h2>Examples</h2>
  @for (sample of sampleList; track sample.exampleName) {
  <hlx-example-viewer [inputViewerComponent]="sample"></hlx-example-viewer>

  }
</hlx-page>
