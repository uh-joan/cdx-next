<div class="top-block">
  <img [src]="cardData().imageUrl" [alt]="cardData().title" ngOptimizedImage />
</div>

<div class="bottom-block">
  <span class="mat-display-medium"> {{ cardData().title }} </span>
  <span class="mat-body-xlarge"> {{ cardData().text }} </span>
  <a [routerLink]="cardData().url" mat-stroked-button>
    {{ cardData().buttonName }}
  </a>
</div>
