<div class="component-section">
  <h2>{{ inputViewerComponent()?.exampleName }}</h2>
  <ng-template #dynamicContainer></ng-template>
</div>

<mat-tab-group
  class="snippet-section mat-mdc-tab-group--no-padding-left"
  [style.height.rem]="inputViewerComponent()?.height || 40"
>
  <mat-tab label="HTML">
    <cdx-highlight
      [text]="inputViewerComponent()?.htmlCode || ''"
      [language]="'html'"
    ></cdx-highlight>
  </mat-tab>
  @if (!inputViewerComponent()?.hideCss) {
    <mat-tab label="CSS">
      <cdx-highlight
        [text]="inputViewerComponent()?.cssCode || ''"
        [language]="'css'"
      ></cdx-highlight>
    </mat-tab>
  }
  <mat-tab label="TypeScript">
    <cdx-highlight
      [text]="inputViewerComponent()?.tsCode || ''"
      [language]="'typescript'"
    ></cdx-highlight>
  </mat-tab>
</mat-tab-group>
