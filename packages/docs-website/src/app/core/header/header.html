<header hlx-header class="header" [branded]="!isNarrow()">
  <hlx-header-product-name [routerLink]="['/home']">
    {{ isNarrow() ? 'Helix' : 'Helix Design System' }}
  </hlx-header-product-name>
  @if (!isCompact()) {
  <nav class="header__navigation">
    @for (link of links; track link.path) {
    <a
      matButton
      class="header__link"
      [routerLink]="[link.path]"
      routerLinkActive="header__link--active"
    >
      {{ link.label }}
    </a>
    }
  </nav>
  }
  <hlx-header-global>
    @if (isCompact()) {
    <button
      matIconButton
      class="header__nav-trigger"
      aria-label="Open navigation menu"
      [matMenuTriggerFor]="navigationMenu"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #navigationMenu="matMenu">
      @for (link of links; track link.path) {
      <a mat-menu-item [routerLink]="[link.path]">{{ link.label }}</a>
      }
    </mat-menu>
    }
    <button class="header__menu" matButton [matMenuTriggerFor]="versionMenu">
      {{ isNarrow() ? 'v' : 'Version: ' }}{{ currentVersion() }}
    </button>
    <mat-menu #versionMenu="matMenu">
      @for (version of versions(); track version) {
      <button mat-menu-item (click)="onVersionSelected(version)">
        {{ version }}
      </button>
      }
    </mat-menu>
    <cdx-search></cdx-search>
  </hlx-header-global>
</header>
