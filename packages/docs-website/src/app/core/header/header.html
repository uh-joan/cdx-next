<header hlx-header class="header">
  <hlx-header-product-name [routerLink]="['/home']">
    Helix Design System
  </hlx-header-product-name>
  <nav class="header__navigation">
    @for (link of links; track link.path) {
    <a
      matButton
      class="header__link"
      [routerLink]="[link.path]"
      routerLinkActive="header__link--active"
    >
      {{ link.label }}
    </a>
    }
  </nav>
  <hlx-header-global>
    <button class="header__menu" matButton [matMenuTriggerFor]="versionMenu">
      Version: {{ currentVersion() }}
    </button>
    <mat-menu #versionMenu="matMenu">
      @for (version of versions(); track version) {
      <button mat-menu-item (click)="onVersionSelected(version)">
        {{ version }}
      </button>
      }
    </mat-menu>
    <cdx-search></cdx-search>
  </hlx-header-global>
</header>
