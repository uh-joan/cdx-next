<header hlx-header class="header" [branded]="false">
  <hlx-header-product-name [routerLink]="['/home']">
    Helix Design System
  </hlx-header-product-name>
  <nav class="header__navigation">
    @for (link of links; track link.path) {
    <a
      mat-button
      class="header__link"
      [routerLink]="[link.path]"
      routerLinkActive="header__link--active"
    >
      {{ link.label }}
    </a>
    }
  </nav>
  <hlx-header-global>
    <mat-select class="header__select" [formControl]="versionControl">
      @for (version of versions; track version) {
      <mat-option [value]="version"> Version: {{ version }} </mat-option>
      }
    </mat-select>
    <cdx-search></cdx-search>
  </hlx-header-global>
</header>
