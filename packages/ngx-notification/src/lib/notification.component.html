<div class="cdx-notification__icon">
  <div #customIconWrapper>
    <ng-content select="[icon]"></ng-content>
  </div>
  <mat-icon *ngIf="!customIconWrapper?.children?.length">{{
    notificationIcons[severity]
  }}</mat-icon>
</div>

<div class="cdx-notification__content">
  <div class="cdx-notification__title mat-title" *ngIf="title">{{ title }}</div>
  <ng-content></ng-content>
  <div class="cdx-notification__actions" *ngIf="presentation === 'inline'">
    <ng-container
      *ngTemplateOutlet="
        actionsTemplate;
        context: { action: this.action, $implicit: actionsTemplate }
      "
    ></ng-container>
  </div>
</div>
<div class="cdx-notification__actions" *ngIf="presentation === 'banner'">
  <ng-container
    *ngTemplateOutlet="
      actionsTemplate;
      context: { action: this.action, $implicit: actionsTemplate }
    "
  ></ng-container>
  <button
    mat-button
    [color]="severity"
    (click)="onDismiss()"
    *ngIf="!!dismissable"
  >
    Dismiss
  </button>
</div>
<div
  class="cdx-notification__close"
  *ngIf="presentation === 'inline' && !!dismissable"
>
  <button mat-button [color]="severity" (click)="onDismiss()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<ng-template #actionsTemplate>
  <button mat-button [color]="severity" (click)="onAction()" *ngIf="action">
    {{ action }}
  </button>
  <ng-content select="[actions]"></ng-content>
</ng-template>
