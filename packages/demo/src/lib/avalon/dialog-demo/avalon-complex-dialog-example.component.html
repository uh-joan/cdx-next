<h2 mat-dialog-title>Complex Dialog Title</h2>

<div mat-dialog-content>
  <p>
    A dialog is a type of modal window that appears in front of app content to
    provide critical information, or prompt for a decision to be made.
  </p>
</div>
<mat-divider color="rgba(208, 208, 208, 1)"></mat-divider>
<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial>
    Install
  </button>
</div>
