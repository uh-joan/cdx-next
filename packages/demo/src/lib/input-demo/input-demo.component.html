<form class="example-form" [style.fontSize.px]="fontSize">
  <h2>{{ appearance }}</h2>
  <mat-form-field class="example-full-width" [appearance]="appearance">
    <mat-label>Company (disabled)</mat-label>
    <input matInput disabled value="Google" />
  </mat-form-field>
  <table class="example-full-width" cellspacing="0">
    <tr>
      <td>
        <mat-form-field
          class="example-full-width"
          [appearance]="appearance"
          floatLabel="always"
        >
          <mat-label>First name (required)</mat-label>
          <input matInput required [formControl]="firstName" />
          <mat-error>Something went wrong</mat-error>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="example-full-width" [appearance]="appearance">
          <mat-label>Long Last Name That Will Be Truncated</mat-label>
          <input matInput />
        </mat-form-field>
      </td>
    </tr>
  </table>
  <p>
    <mat-form-field class="example-full-width" [appearance]="appearance">
      <mat-label>Address</mat-label>
      <textarea matInput placeholder="Ex. 100 Main St">
1600 Amphitheatre Pkwy</textarea
      >
    </mat-form-field>
    <mat-form-field class="example-full-width" [appearance]="appearance">
      <mat-label>Address 2</mat-label>
      <textarea matInput></textarea>
    </mat-form-field>
  </p>
  <table class="example-full-width" cellspacing="0">
    <tr>
      <td>
        <mat-form-field class="example-full-width" [appearance]="appearance">
          <mat-label>City</mat-label>
          <input matInput placeholder="Ex. San Francisco" />
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="example-full-width" [appearance]="appearance">
          <mat-label>State</mat-label>
          <input matInput placeholder="Ex. California" />
          <mat-hint>Use 2-letter code (hint)</mat-hint>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="example-full-width" [appearance]="appearance">
          <mat-label>Postal Code</mat-label>
          <input
            matInput
            #postalCode
            maxlength="5"
            placeholder="Ex. 94105"
            value="94043"
          />
          <mat-hint align="end">{{ postalCode.value.length }} / 5</mat-hint>
        </mat-form-field>
      </td>
    </tr>
  </table>
</form>
