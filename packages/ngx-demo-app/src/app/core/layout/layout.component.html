@if (isHelix()) {
  <header hlx-header>
    <hlx-header-product-name
      >Clarivate Digital Experience
    </hlx-header-product-name>
    <div class="hlx-selectors">
      <cdx-language-selector></cdx-language-selector>
      <cdx-theme-selector></cdx-theme-selector>
      <cdx-mode-selector></cdx-mode-selector>
    </div>
    <hlx-header-global>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 10px;
          width: 100%;
          height: 100%;
        "
      >
        <mat-icon>language</mat-icon>
        <mat-icon>apps</mat-icon>
        <mat-icon class="material-icons-outlined">account_circle</mat-icon>
        <!-- <cdx-header-global-user-profile withSessionManagement
        [shouldShowTranslations]="true"></cdx-header-global-user-profile> -->
      </div>
    </hlx-header-global>
  </header>
} @else {
  <header cdx-header>
    <hlx-header-global>
      <div class="cdx-selectors">
        <cdx-language-selector></cdx-language-selector>
        <cdx-theme-selector></cdx-theme-selector>
        <cdx-mode-selector></cdx-mode-selector>
      </div>
      <cdx-header-global-user-profile
        withSessionManagement
        [shouldShowTranslations]="true"
      >
      </cdx-header-global-user-profile>
    </hlx-header-global>
    <cdx-header-product-name [routerLink]="''">
      Clarivate Digital Experience
    </cdx-header-product-name>
    <nav mat-tab-nav-bar cdx-size-compact style="flex: 4" [tabPanel]="tabPanel">
      @for (link of links; track link) {
        <a mat-tab-link [routerLink]="link.path" [active]="isActive(link.path)">
          {{ link.name | translate | titlecase }}
        </a>
      }
    </nav>
  </header>
}
<mat-tab-nav-panel #tabPanel>
  <cdx-left-navigation></cdx-left-navigation>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
@if (isHelix()) {
  <footer hlx-footer>
    <a hlxFooterLink href="https://stackoverflow.com/">Stack Overflow</a>
    <a hlxFooterLink href="https://www.powerlanguage.co.uk/wordle/"> Wordle </a>
  </footer>
} @else {
  <footer cdx-footer [shouldShowTranslations]="true">
    <a cdxFooterLink href="https://stackoverflow.com/">Stack Overflow</a>
    <a cdxFooterLink href="https://www.powerlanguage.co.uk/wordle/"> Wordle </a>
  </footer>
}
