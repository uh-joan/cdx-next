<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Theme Selector"
  #tooltip="matTooltip"
  matTooltip="Theme"
>
  <div
    class="cdx-circle cdx-circle--{{ currentTheme }}"
    [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
  ></div>
</button>
<mat-menu #menu="matMenu">
  <ng-container *ngFor="let theme of themes">
    <button mat-menu-item (click)="selectTheme(theme)">
      <div
        class="cdx-circle cdx-circle--{{ theme }}"
        [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
      ></div>
      {{ theme | titlecase }}
    </button>
  </ng-container>
</mat-menu>
