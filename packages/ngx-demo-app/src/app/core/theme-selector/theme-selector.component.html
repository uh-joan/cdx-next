<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Theme Selector"
  #tooltip="matTooltip"
  matTooltip="Theme"
>
  <div
    class="cdx-circle cdx-circle--{{ currentTheme }}"
    [class.cdx-circle-dark]="currentMode() === 'dark'"
  ></div>
</button>
<mat-menu #menu="matMenu">
  @for (theme of themes; track theme) {
    <button mat-menu-item (click)="selectTheme(theme)">
      <div
        class="cdx-circle cdx-circle--{{ theme }}"
        [class.cdx-circle-dark]="currentMode() === 'dark'"
      ></div>
      {{ theme | titlecase }}
    </button>
  }
</mat-menu>
