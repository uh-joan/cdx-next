<mat-form-field appearance="outline">
  <mat-label>{{ 'APP.THEME' | translate }}</mat-label>
  <mat-select
    placeholder="Choose an option"
    panelClass="common-panel"
    formControlName="theme"
    [(value)]="currentTheme"
    (selectionChange)="selectTheme(currentTheme)"
  >
    <mat-select-trigger>
      <div
        class="cdx-circle cdx-circle--{{ currentTheme }}"
        [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
      ></div>
      {{ currentTheme | titlecase }}
    </mat-select-trigger>

    <ng-container *ngFor="let theme of THEMES">
      <mat-option [value]="theme"
        ><div
          class="cdx-circle cdx-circle--{{ theme }}"
          [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
        ></div>
        {{ theme | titlecase }}</mat-option
      >
    </ng-container>
  </mat-select>
</mat-form-field>
<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Example icon-button with a menu"
>
  <div
    class="cdx-circle cdx-circle--{{ currentTheme }}"
    [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
  ></div>
</button>
<mat-menu #menu="matMenu">
  <ng-container *ngFor="let theme of THEMES">
    <button mat-menu-item (click)="selectTheme(theme)">
      <div
        class="cdx-circle cdx-circle--{{ theme }}"
        [class.cdx-circle-dark]="(currentMode$ | async) === 'dark'"
      ></div>
      {{ theme | titlecase }}
    </button>
  </ng-container>
</mat-menu>
