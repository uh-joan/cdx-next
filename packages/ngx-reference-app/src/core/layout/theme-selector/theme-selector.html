<mat-form-field appearance="outline">
  <mat-label>{{ 'APP.THEME' | translate }}</mat-label>
  <mat-select
    placeholder="Choose an option"
    panelClass="common-panel"
    [value]="themeService.currentTheme()"
    (selectionChange)="selectTheme($event.value)"
  >
    <mat-select-trigger>
      <div
        class="cdx-circle cdx-circle--{{ themeService.currentTheme() }}"
        [class.cdx-circle-dark]="themeService.currentThemeMode() === 'dark'"
      ></div>
      {{ themeService.currentTheme() | titlecase }}
    </mat-select-trigger>

    @for (theme of themeService.themes; track theme) {
    <mat-option [value]="theme">
      <div
        class="cdx-circle cdx-circle--{{ theme }}"
        [class.cdx-circle-dark]="themeService.currentThemeMode() === 'dark'"
      ></div>
      {{ theme | titlecase }}
    </mat-option>
    }
  </mat-select>
</mat-form-field>
<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Example icon-button with a menu"
>
  <div
    class="cdx-circle cdx-circle--{{ themeService.currentTheme() }}"
    [class.cdx-circle-dark]="themeService.currentThemeMode() === 'dark'"
  ></div>
</button>
<mat-menu #menu="matMenu">
  @for (theme of themeService.themes; track theme) {
  <button mat-menu-item (click)="selectTheme(theme)">
    <div
      class="cdx-circle cdx-circle--{{ theme }}"
      [class.cdx-circle-dark]="themeService.currentThemeMode() === 'dark'"
    ></div>
    {{ theme | titlecase }}
  </button>
  }
</mat-menu>
